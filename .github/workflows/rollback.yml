name: Rollback

# Manual, on-demand rollback to the previous release (runs ansible/rollback.yml).
# Rolling back production still goes through the `production` environment's
# Required-reviewers gate, so it also needs human approval.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back to its previous release
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

# Share the deploy concurrency group for the chosen environment so a rollback
# and a deploy can never run against the same environment simultaneously.
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback · ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }} # production rollback still requires approval
    steps:
      - uses: actions/checkout@v4
      - name: Roll back with Ansible
        uses: ./.github/actions/ansible-deploy
        with:
          playbook: rollback.yml
          inventory: inventory/${{ inputs.environment }}
          # no `ref`: rollback re-points `current` to the previous good release
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
