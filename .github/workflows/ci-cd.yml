name: CI/CD

# Pipeline runs on every push to the deployment branches and on PRs targeting
# them. PRs get lint -> test -> build (fast feedback, gates merges via branch
# protection). Pushes additionally deploy: dev -> staging, main -> production.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# The GITHUB_TOKEN is read-only by default; nothing in this pipeline needs more.
permissions:
  contents: read

# Cancel superseded runs on a PR branch; let branch pushes run to completion so
# no deploy is interrupted. (Per-environment deploy serialization is set below.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: "8.3" # keep in lockstep with composer.json, DDEV, and the server

jobs:
  # ── Stage 1 · Lint & Test (run in parallel) ──────────────────────────────
  lint:
    name: Lint · Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3 # installs (with dev deps) + caches
      - run: composer lint # pint --test

  test:
    name: Test · Pest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none # switch to pcov + `--coverage --min=NN` to gate coverage
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer test # pest

  # ── Stage 2 · Build (prove the production build is reproducible) ──────────
  build:
    name: Build · composer --no-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - name: Validate composer manifest & lockfile
        run: composer validate --no-check-publish
      - name: Production install (mirrors the server's build flags)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
      # No artifact is uploaded: the server rebuilds from the pinned commit at
      # deploy time. Determinism comes from the committed composer.lock + the
      # exact SHA + a fixed PHP version. This stage fails the whole pipeline
      # *before* any deploy if that production build would break.

  # ── Stage 3a · Deploy → staging (develop, automatic) ─────────────────────
  deploy-staging:
    name: Deploy · staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment:
      name: staging
      url: https://wlsb.growsellapp.com
    concurrency: # never run two staging deploys at once; never cancel one
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Ansible
        uses: ./.github/actions/ansible-deploy
        with:
          inventory: inventory/staging
          ref: ${{ github.sha }}
          health-check-url: https://wlsb.growsellapp.com
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

  # ── Stage 3b · Deploy → production (main, MANUAL APPROVAL) ────────────────
  # The gate is the `production` GitHub Environment: configure Required
  # reviewers on it (Settings ▸ Environments ▸ production). This job then pauses
  # and waits for a human to approve before any step runs. See docs/ci-cd.md.
  deploy-production:
    name: Deploy · production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://example.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Ansible
        uses: ./.github/actions/ansible-deploy
        with:
          inventory: inventory/production
          ref: ${{ github.sha }}
          health-check-url: https://example.com
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
