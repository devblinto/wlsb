---
# ─────────────────────────────────────────────────────────────────────────────
# provision.yml — bring a bare Ubuntu 24.04 VPS to a hardened, ready-to-serve
# state: base packages, security hardening, PHP-FPM, MySQL 8.4, Nginx, Composer,
# WP-CLI, the Bedrock directory layout, and (optionally) a Let's Encrypt cert.
#
# Idempotent: safe to re-run any time to converge configuration.
#
#   ansible-playbook provision.yml -i inventory/production --ask-vault-pass
# ─────────────────────────────────────────────────────────────────────────────
- name: Provision web server
  hosts: web
  become: true
  gather_facts: true

  # Fail fast with a clear message if required secrets were not supplied.
  pre_tasks:
    - name: Assert required vault variables are defined
      ansible.builtin.assert:
        that:
          - mysql_root_password | default('') | length > 0
          - vault_db_password | default('') | length > 0
          - wp_salts is defined
          - admin_ssh_keys | default([]) | length > 0
        fail_msg: >-
          Missing required secrets. Copy inventory/<env>/group_vars/all/vault.yml.example
          to vault.yml, fill it in, encrypt it with `ansible-vault encrypt`, and set
          at least one key in `admin_ssh_keys`.
        quiet: true
      tags: [always]

  roles:
    - role: common
      tags: [common, base]
    - role: deploy_user
      tags: [users, security]
    - role: ssh_hardening
      tags: [ssh, security]
    - role: firewall
      tags: [firewall, security]
    - role: fail2ban
      tags: [fail2ban, security]
    - role: php
      tags: [php]
    - role: mysql
      tags: [mysql, db]
    - role: composer
      tags: [composer]
    - role: wordpress
      tags: [wordpress, bedrock]
    - role: nginx
      tags: [nginx, web]
    - role: letsencrypt
      tags: [letsencrypt, tls]
      when: letsencrypt_enabled | bool
