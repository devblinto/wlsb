[defaults]
# Default to the production inventory. Override with `-i inventory/staging`.
inventory              = inventory/production
roles_path             = roles
collections_path       = ./collections:~/.ansible/collections
# Verify host keys — protects against MITM on first connect. See README for the
# recommended `ssh-keyscan` bootstrap step.
host_key_checking      = True
retry_files_enabled    = False
# Readable, diff-friendly output (callback ships in community.general).
stdout_callback        = community.general.yaml
callbacks_enabled      = ansible.posix.profile_tasks
# Never auto-install a system python; use whatever the target already has.
interpreter_python     = auto_silent
forks                  = 10
timeout                = 30
deprecation_warnings   = True
force_valid_group_names = ignore
# Uncomment to avoid typing the vault password every run:
# vault_password_file  = .vault_pass

[ssh_connection]
# Reuse SSH connections and stream module transfers — large speedup on multi-task plays.
pipelining             = True
ssh_args               = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
# Plays opt into become explicitly; escalate with sudo when they do.
become_method          = sudo
