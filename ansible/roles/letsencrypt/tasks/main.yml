---
- name: Require an ACME account email
  ansible.builtin.assert:
    that: letsencrypt_email | length > 0
    fail_msg: "letsencrypt_email must be set (Let's Encrypt requires a contact address)."
    quiet: true

- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present

- name: Install the renewal deploy-hook (reload Nginx after each renewal)
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by Ansible — reload Nginx to pick up the renewed certificate.
      systemctl reload nginx

# certbot's apt package ships a systemd timer that renews twice daily.
- name: Ensure the certbot renewal timer is enabled
  ansible.builtin.service:
    name: certbot.timer
    state: started
    enabled: true

- name: Obtain the TLS certificate (HTTP-01 via webroot)
  ansible.builtin.command:
    cmd: >-
      certbot certonly --webroot -w {{ letsencrypt_webroot }}
      --email {{ letsencrypt_email }} --agree-tos --non-interactive
      --keep-until-expiring --expand
      {{ '--staging' if letsencrypt_staging else '--no-eff-email' }}
      {% for d in ([site_domain] + site_aliases) %}-d {{ d }} {% endfor %}
    creates: "/etc/letsencrypt/live/{{ site_domain }}/fullchain.pem"
  register: certbot_obtain

- name: Re-render the Nginx vhost with TLS enabled
  ansible.builtin.include_role:
    name: nginx
    tasks_from: vhost.yml
  when: certbot_obtain is changed
