---
mysql_version: "8.4"
# Oracle APT repo component that provides the 8.4 LTS series.
mysql_apt_component: "mysql-{{ mysql_version }}-lts"
mysql_apt_key_url: "https://repo.mysql.com/RPM-GPG-KEY-mysql-2025"
mysql_apt_keyring: /etc/apt/keyrings/mysql.gpg

mysql_socket: /var/run/mysqld/mysqld.sock
mysql_bind_address: "127.0.0.1"     # loopback only — never listen on the network
mysql_innodb_buffer_pool_mb: 256
mysql_max_connections: 100

# Application database (created & granted). Secrets come from the vault.
db_name: app
db_user: app
db_password: ""                     # ← must be provided via vault_db_password
mysql_root_password: ""             # ← must be provided via vault_mysql_root_password
