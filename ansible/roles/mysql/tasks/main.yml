---
- name: Fail early if MySQL secrets are missing
  ansible.builtin.assert:
    that:
      - mysql_root_password | length > 0
      - db_password | length > 0
    fail_msg: "mysql_root_password and db_password must be set (see the vault)."
    quiet: true

# ── APT repository (Oracle MySQL 8.4 LTS) ──────────────────────────────────────
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the MySQL APT signing key
  ansible.builtin.get_url:
    url: "{{ mysql_apt_key_url }}"
    dest: /tmp/mysql-apt-key.asc
    mode: "0644"
    force: true # always fetch the current key so a rotated/renewed key is picked up
  register: mysql_apt_key_download

- name: Install the MySQL signing key into a dedicated keyring
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ mysql_apt_keyring }} /tmp/mysql-apt-key.asc"
  # Re-dearmor only when the downloaded key actually changed (idempotent, and
  # correctly refreshes the keyring on key rotation).
  when: mysql_apt_key_download is changed

- name: Add the MySQL 8.4 LTS APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ mysql_apt_keyring }}] https://repo.mysql.com/apt/ubuntu {{ ansible_distribution_release }} {{ mysql_apt_component }} mysql-tools"
    filename: mysql
    state: present
    update_cache: true

# ── Non-interactive install (preseed root password + strong auth plugin) ───────
- name: Ensure debconf-utils is present (required by the debconf module)
  ansible.builtin.apt:
    name: debconf-utils
    state: present

- name: Preseed MySQL root password
  ansible.builtin.debconf:
    name: mysql-community-server
    question: "{{ item }}"
    value: "{{ mysql_root_password }}"
    vtype: password
  loop:
    - mysql-community-server/root-pass
    - mysql-community-server/re-root-pass
  no_log: true

- name: Preseed MySQL to use strong password encryption (caching_sha2)
  ansible.builtin.debconf:
    name: mysql-community-server
    question: mysql-community-server/default-auth-override
    value: "Use Strong Password Encryption (RECOMMENDED)"
    vtype: select

- name: Install MySQL 8.4 server and client
  ansible.builtin.apt:
    name:
      - mysql-community-server
      - mysql-community-client
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  notify: Restart mysql

# ── Root client credentials so subsequent modules authenticate idempotently ────
- name: Write root client config (~/.my.cnf)
  ansible.builtin.template:
    src: root.my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Ensure the MySQL conf.d directory exists
  ansible.builtin.file:
    path: /etc/mysql/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Apply server tuning and bind-address
  ansible.builtin.template:
    src: zz-app.cnf.j2
    # conf.d is included by Oracle's /etc/mysql/my.cnf on every supported layout.
    dest: /etc/mysql/conf.d/zz-app.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mysql

- name: Ensure MySQL is started and enabled
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

# Apply any pending restart now so the hardening/DB steps connect to the tuned server.
- name: Apply configuration before database operations
  ansible.builtin.meta: flush_handlers

# ── Hardening (mysql_secure_installation, done idempotently) ────────────────────
- name: Remove anonymous MySQL users
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ mysql_socket }}"

- name: Disallow remote root login (keep root@localhost only)
  community.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    state: absent
    login_unix_socket: "{{ mysql_socket }}"
  loop:
    - "{{ ansible_hostname }}"
    - "%"

- name: Remove the test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: "{{ mysql_socket }}"

# ── Application database & user ─────────────────────────────────────────────────
- name: Create the application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
    login_unix_socket: "{{ mysql_socket }}"

- name: Create the application database user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    # MySQL 8.4 doesn't load mysql_native_password (what `password:` uses); create
    # the user with caching_sha2_password to match the server's default auth.
    plugin: caching_sha2_password
    plugin_auth_string: "{{ db_password }}"
    # Match the host the app actually connects from (db_host, e.g. 127.0.0.1).
    # 'localhost' (socket) and '127.0.0.1' (TCP) are distinct grants in MySQL.
    host: "{{ db_host }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ mysql_socket }}"
  no_log: true
