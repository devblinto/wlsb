---
# Atomic switch: create a temporary symlink, then rename it over `current`.
# rename(2) on the same filesystem is atomic, so requests never see a missing or
# half-updated `current`.
- name: Stage the new current symlink
  ansible.builtin.command:
    cmd: "ln -sfn {{ release_path }} {{ deploy_path }}/current.tmp"
  changed_when: true

- name: Atomically activate the new release
  ansible.builtin.command:
    cmd: "mv -Tf {{ deploy_path }}/current.tmp {{ deploy_path }}/current"
  changed_when: true

- name: Reload PHP-FPM (clears OPcache, picks up the new release path)
  ansible.builtin.command:
    cmd: "sudo -n systemctl reload php{{ php_version }}-fpm"
  changed_when: true

# ── Optional WP-CLI post-deploy maintenance ─────────────────────────────────────
- name: Check whether WordPress is installed
  ansible.builtin.command:
    cmd: "{{ wpcli_bin }} core is-installed"
    chdir: "{{ deploy_path }}/current"
  register: wp_installed
  changed_when: false
  failed_when: false
  when: deploy_run_wpcli_maintenance | bool

- name: Flush caches and rewrite rules
  ansible.builtin.command:
    cmd: "{{ wpcli_bin }} {{ item }}"
    chdir: "{{ deploy_path }}/current"
  loop:
    - cache flush
    - rewrite flush --hard
  changed_when: true
  when:
    - deploy_run_wpcli_maintenance | bool
    - wp_installed.rc is defined and wp_installed.rc == 0

# ── Prune old releases ──────────────────────────────────────────────────────────
- name: Enumerate existing releases (oldest first)
  ansible.builtin.find:
    paths: "{{ deploy_path }}/releases"
    file_type: directory
    recurse: false
  register: all_releases

- name: Sort releases oldest-first
  ansible.builtin.set_fact:
    sorted_releases: "{{ all_releases.files | map(attribute='path') | sort }}"

- name: Determine releases to prune (keep the newest N)
  ansible.builtin.set_fact:
    releases_to_prune: >-
      {{ sorted_releases[0:(sorted_releases | length - deploy_keep_releases)]
         if (sorted_releases | length > deploy_keep_releases) else [] }}

- name: Remove old releases
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ releases_to_prune }}"

- name: Report the active release
  ansible.builtin.debug:
    msg: "Now serving release {{ release_name }} ({{ git_checkout.after | default('unknown') }})"
