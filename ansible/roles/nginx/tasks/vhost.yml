---
# Determine whether a real TLS certificate already exists so the vhost template
# can decide between HTTP-only bootstrap and full HTTPS. This file is included
# both from the nginx role and (after issuance) from the letsencrypt role.
- name: Check for an existing TLS certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ site_domain }}/fullchain.pem"
  register: tls_cert_stat

- name: Set TLS availability fact
  ansible.builtin.set_fact:
    has_tls_cert: "{{ tls_cert_stat.stat.exists }}"

- name: Template the site virtual host
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ site_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ site_name }}.conf"
    state: link
  notify: Reload nginx

# Validate the full config (now that the site is symlinked in) before any reload
# handler can fire. A syntax error fails the play with the live config untouched.
- name: Validate the complete Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
