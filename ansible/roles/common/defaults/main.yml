---
# Base packages present on every server.
common_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - unzip
  - acl            # required for become_user file ops on some setups
  - rsync
  - htop
  - vim
  - python3-pymysql  # community.mysql connector
  - cron

server_timezone: "Etc/UTC"
swap_file_size_mb: 2048
swap_file_path: /swapfile
swap_swappiness: 10

# Automatic unattended security upgrades.
unattended_upgrades_enabled: true
unattended_upgrades_auto_reboot: false
unattended_upgrades_auto_reboot_time: "03:30"
