---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming }}"

- name: Set default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing }}"

- name: Rate-limit SSH
  community.general.ufw:
    rule: limit
    port: "{{ firewall_ssh_port }}"
    proto: tcp
  when: firewall_limit_ssh | bool

- name: Allow configured TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"
  # SSH is handled by the rate-limit rule above; don't add a plain allow too.
  when: not (firewall_limit_ssh | bool and (item | string) == (firewall_ssh_port | string))

- name: Enable UFW and turn on logging
  community.general.ufw:
    state: enabled
    logging: "on"
