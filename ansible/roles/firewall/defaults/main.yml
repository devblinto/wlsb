---
firewall_allowed_tcp_ports:
  - "22"
  - "80"
  - "443"
# Default-deny inbound, allow all outbound.
firewall_default_incoming: deny
firewall_default_outgoing: allow
# Rate-limit SSH to slow down brute-force attempts.
firewall_limit_ssh: true
firewall_ssh_port: "{{ ansible_port | default(22) }}"
