---
- name: Install PHP-FPM and extensions
  ansible.builtin.apt:
    name: "{{ php_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Restart php-fpm

- name: Apply production php.ini overrides (FPM SAPI)
  ansible.builtin.template:
    src: zz-app.ini.j2
    dest: "/etc/php/{{ php_version }}/fpm/conf.d/zz-app.ini"
    owner: root
    group: root
    mode: "0644"
  notify: Restart php-fpm

- name: Apply matching php.ini overrides (CLI SAPI, for WP-CLI & Composer)
  ansible.builtin.template:
    src: zz-app.ini.j2
    dest: "/etc/php/{{ php_version }}/cli/conf.d/zz-app.ini"
    owner: root
    group: root
    mode: "0644"

- name: Remove the default www pool (replaced by a per-site pool)
  ansible.builtin.file:
    path: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    state: absent
  notify: Restart php-fpm

- name: Configure the dedicated FPM pool for the site
  ansible.builtin.template:
    src: pool.conf.j2
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/{{ site_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart php-fpm

- name: Ensure PHP-FPM is started and enabled
  ansible.builtin.service:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true
