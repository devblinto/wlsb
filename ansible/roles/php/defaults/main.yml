---
php_version: "8.3"

# WordPress/Bedrock runtime extensions. Ubuntu 24.04 ships PHP 8.3 natively, so
# no third-party PPA is needed.
php_packages:
  - "php{{ php_version }}-fpm"
  - "php{{ php_version }}-cli"
  - "php{{ php_version }}-mysql"
  - "php{{ php_version }}-curl"
  - "php{{ php_version }}-gd"
  - "php{{ php_version }}-mbstring"
  - "php{{ php_version }}-xml"
  - "php{{ php_version }}-zip"
  - "php{{ php_version }}-intl"
  - "php{{ php_version }}-bcmath"
  - "php{{ php_version }}-imagick"
  - "php{{ php_version }}-opcache"

# php.ini values (applied to the FPM SAPI).
php_memory_limit: "256M"
php_upload_max_filesize: "64M"
php_post_max_size: "64M"
php_max_execution_time: 120
php_max_input_vars: 3000
php_expose_php: false

# OPcache — production tuning. validate_timestamps=0 means code changes only take
# effect after an FPM reload, which the deploy playbook triggers on every release.
php_opcache_memory_mb: 128
php_opcache_max_files: 20000
php_opcache_validate_timestamps: 0
php_opcache_revalidate_freq: 0

# FPM pool process manager.
php_fpm_pm: dynamic
php_fpm_pm_max_children: 12
php_fpm_pm_start_servers: 3
php_fpm_pm_min_spare_servers: 2
php_fpm_pm_max_spare_servers: 5
php_fpm_pm_max_requests: 500

deploy_user: deploy
deploy_group: "{{ deploy_user }}"
site_name: app
