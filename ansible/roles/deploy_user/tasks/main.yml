---
- name: Ensure at least one admin SSH key is provided
  ansible.builtin.assert:
    that: admin_ssh_keys | length > 0
    fail_msg: >-
      admin_ssh_keys is empty. Add your public key(s) via the vault before
      provisioning — SSH password authentication gets disabled during hardening.
    quiet: true

- name: Create deploy group
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    # Membership in www-data lets Nginx read app files where needed.
    groups: [www-data]
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Install admin SSH keys for the deploy user
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ admin_ssh_keys }}"
  no_log: true

- name: Install admin SSH keys for root (bootstrap / break-glass access)
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ admin_ssh_keys }}"
  no_log: true

# The deploy user needs to reload PHP-FPM after a release without a full sudo
# grant. Restrict it to exactly that command.
- name: Allow deploy user to reload PHP-FPM without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}-phpfpm"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Managed by Ansible
      {{ deploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl reload php{{ php_version }}-fpm, /usr/bin/systemctl reload-or-restart php{{ php_version }}-fpm

- name: Create the deploy root directory
  ansible.builtin.file:
    path: "{{ deploy_path }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
