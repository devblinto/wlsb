---
# ─────────────────────────────────────────────────────────────────────────────
# rollback.yml — repoint `current` to the previous release and reload PHP-FPM.
#
#   ansible-playbook rollback.yml -i inventory/production --ask-vault-pass
#
# Rolls back exactly one release. Run again to step back further (as long as the
# older release is still retained under releases/).
# ─────────────────────────────────────────────────────────────────────────────
- name: Roll back to the previous release
  hosts: web
  remote_user: "{{ deploy_user }}"
  become: false
  gather_facts: false

  tasks:
    - name: Discover releases (newest first)
      ansible.builtin.find:
        paths: "{{ deploy_path }}/releases"
        file_type: directory
        recurse: false
      register: release_dirs

    - name: Sort releases by name (timestamps sort chronologically)
      ansible.builtin.set_fact:
        sorted_releases: "{{ release_dirs.files | map(attribute='path') | sort | reverse | list }}"

    - name: Ensure there is a release to roll back to
      ansible.builtin.assert:
        that: sorted_releases | length >= 2
        fail_msg: "Need at least two releases to roll back; found {{ sorted_releases | length }}."
        quiet: true

    - name: Resolve the currently linked release
      ansible.builtin.stat:
        path: "{{ deploy_path }}/current"
      register: current_link

    - name: Select the previous release
      vars:
        current_target: "{{ current_link.stat.lnk_target | default('') }}"
      ansible.builtin.set_fact:
        # If current points at the newest release, pick the next one down;
        # otherwise pick the newest (recover from a broken/missing symlink).
        rollback_target: >-
          {{ sorted_releases[1] if (current_target == sorted_releases[0]) else sorted_releases[0] }}

    - name: Atomically switch `current` to the previous release
      ansible.builtin.command:
        cmd: >-
          ln -sfn {{ rollback_target | quote }} {{ deploy_path }}/current.tmp
      changed_when: true

    - name: Move the temporary symlink into place (atomic rename)
      ansible.builtin.command:
        cmd: mv -Tf {{ deploy_path }}/current.tmp {{ deploy_path }}/current
      changed_when: true

    - name: Reload PHP-FPM to clear OPcache
      # Uses the narrowly-scoped NOPASSWD sudo rule installed for the deploy user,
      # so rollback never needs full root.
      ansible.builtin.command:
        cmd: "sudo -n systemctl reload php{{ php_version }}-fpm"
      changed_when: true

    - name: Report the active release
      ansible.builtin.debug:
        msg: "Rolled back to {{ rollback_target }}"
