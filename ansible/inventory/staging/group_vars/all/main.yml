---
# ═══════════════════════════════════════════════════════════════════════════════
# Staging configuration. Keep this as close to production as possible; only the
# values that genuinely differ (domain, env, branch, DB name) are overridden.
# ═══════════════════════════════════════════════════════════════════════════════

site_name: wlsb
deploy_user: deploy
deploy_group: "{{ deploy_user }}"
deploy_path: "/srv/www/{{ site_name }}"

site_domain: staging.example.com
site_aliases: []
wp_env: staging                          # loads config/environments/staging.php
wp_home: "https://{{ site_domain }}"
wp_siteurl: "{{ wp_home }}/wp"

deploy_repo: "git@github.com:your-org/wlsb.git"
deploy_branch: main                      # or a dedicated `staging` branch
deploy_keep_releases: 3
deploy_use_deploy_key: true
deploy_git_host: github.com

php_version: "8.3"
php_memory_limit: "256M"
php_upload_max_filesize: "64M"
php_post_max_size: "64M"
php_max_execution_time: 120
php_opcache_memory_mb: 128
php_fpm_pm: dynamic
php_fpm_pm_max_children: 6
php_fpm_pm_start_servers: 2
php_fpm_pm_min_spare_servers: 1
php_fpm_pm_max_spare_servers: 3

mysql_version: "8.4"
db_name: "{{ site_name }}_staging"
db_user: "{{ site_name }}"
db_host: "127.0.0.1"
db_prefix: "wp_"
mysql_innodb_buffer_pool_mb: 128

nginx_client_max_body_size: "64M"
nginx_worker_connections: 1024
letsencrypt_enabled: true
letsencrypt_email: "webteam@rightleftagency.com"
letsencrypt_staging: false

firewall_allowed_tcp_ports:
  - "{{ ansible_port | default(22) }}"
  - "80"
  - "443"

admin_ssh_keys: "{{ vault_admin_ssh_keys | default([]) }}"
ssh_permit_root_login: false
ssh_password_authentication: false

server_timezone: "Etc/UTC"
swap_file_size_mb: 2048

db_password: "{{ vault_db_password }}"
wp_salts: "{{ vault_wp_salts }}"
mysql_root_password: "{{ vault_mysql_root_password }}"
