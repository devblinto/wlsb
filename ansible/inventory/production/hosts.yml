# you can switch ansible_user to a personal sudo account if you create one.
all:
  children:
    web:
      hosts:
        wlsb-prod:
          ansible_host: 203.0.113.10        # ← TODO: set to the real prod server IP
          ansible_user: root                # ← initial provisioning user (see README)
          ansible_port: 22
