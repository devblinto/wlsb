---
# ═══════════════════════════════════════════════════════════════════════════════
# Production configuration. Non-secret values live here; secrets live in the
# adjacent (encrypted) vault.yml and are referenced as `vault_*`.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Identity / paths ──────────────────────────────────────────────────────────
site_name: wlsb                          # short slug used for paths, sockets, pools
deploy_user: deploy                      # unprivileged user that owns & runs the app
deploy_group: "{{ deploy_user }}"
deploy_path: "/srv/www/{{ site_name }}"  # release root: releases/, shared/, current

# ── Site / URLs ───────────────────────────────────────────────────────────────
site_domain: example.com                 # ← primary domain (no scheme)
site_aliases:                            # extra server_name entries (e.g. www)
  - "www.example.com"
wp_env: production                       # WP_ENV → production | staging | development

# Canonical URL. WordPress is served from the site root; core lives under /wp.
wp_home: "https://{{ site_domain }}"
wp_siteurl: "{{ wp_home }}/wp"

# ── Application source (Git) ──────────────────────────────────────────────────
deploy_repo: "git@github.com:devblinto/wlsb.git"  # ← your Git remote
deploy_branch: main
deploy_keep_releases: 5                   # how many old releases to retain
# Set true if the repo is private and the server authenticates with a deploy key
# (provide the key as `vault_deploy_private_key` in the vault).
deploy_use_deploy_key: true
deploy_git_host: github.com               # host to add to known_hosts

# ── PHP ───────────────────────────────────────────────────────────────────────
php_version: "8.3"                        # matches composer.json (php >= 8.3) & DDEV
php_memory_limit: "256M"
php_upload_max_filesize: "64M"
php_post_max_size: "64M"
php_max_execution_time: 120
php_opcache_memory_mb: 192
# PHP-FPM pool process-manager tuning (dynamic). Scale to your VPS RAM.
php_fpm_pm: dynamic
php_fpm_pm_max_children: 12
php_fpm_pm_start_servers: 3
php_fpm_pm_min_spare_servers: 2
php_fpm_pm_max_spare_servers: 5

# ── MySQL 8.4 (local) ─────────────────────────────────────────────────────────
mysql_version: "8.4"                      # installed from Oracle's MySQL 8.4 LTS repo
db_name: "{{ site_name }}_prod"
db_user: "{{ site_name }}"
db_host: "127.0.0.1"                      # loopback; never exposed to the network
db_prefix: "wp_"
# InnoDB buffer pool — rule of thumb ≈ 50–70% of RAM on a DB-dedicated box; keep
# conservative when the web + DB share one VPS.
mysql_innodb_buffer_pool_mb: 256

# ── Nginx / TLS ───────────────────────────────────────────────────────────────
nginx_client_max_body_size: "64M"        # keep >= php_upload_max_filesize
nginx_worker_connections: 1024
letsencrypt_enabled: true                 # obtain & auto-renew a real certificate
letsencrypt_email: "webteam@rightleftagency.com"
letsencrypt_staging: false                # true → use LE staging (untrusted test certs)

# ── Firewall (UFW) ────────────────────────────────────────────────────────────
firewall_allowed_tcp_ports:
  - "{{ ansible_port | default(22) }}"    # SSH
  - "80"                                  # HTTP (ACME + redirect)
  - "443"                                 # HTTPS

# ── SSH hardening ─────────────────────────────────────────────────────────────
# Public keys granted admin (sudo) SSH access. REQUIRED — password auth is
# disabled during hardening, so lock yourself out if this is empty.
# Populate via vault (recommended) or inline here.
admin_ssh_keys: "{{ vault_admin_ssh_keys | default([]) }}"
ssh_permit_root_login: false              # after first run, connect as a sudo user
ssh_password_authentication: false

# ── Server basics ─────────────────────────────────────────────────────────────
server_timezone: "Etc/UTC"
# Create a swap file when the VPS has little RAM. 0 disables.
swap_file_size_mb: 2048

# ── Secrets (sourced from the encrypted vault) ────────────────────────────────
db_password: "{{ vault_db_password }}"
wp_salts: "{{ vault_wp_salts }}"
mysql_root_password: "{{ vault_mysql_root_password }}"
